<!doctype html>
<html>
  <head>
    <title>Test HOCA API Pricing</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 50px auto;
        padding: 20px;
        background: #1a1a1a;
        color: #fff;
      }
      h1 {
        color: #ff6b35;
      }
      .plan {
        background: #2a2a2a;
        padding: 20px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #444;
      }
      .price {
        font-size: 24px;
        font-weight: bold;
        color: #ff6b35;
      }
      button {
        background: #ff6b35;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        margin: 10px 0;
      }
      button:hover {
        background: #ff8555;
      }
      pre {
        background: #1a1a1a;
        padding: 10px;
        border-radius: 5px;
        overflow-x: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Test HOCA Pricing API</h1>
    <button onclick="testAPI()">🔄 Fetch Pricing từ API</button>
    <div id="result"></div>

    <script>
      async function testAPI() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "<p>⏳ Đang fetch...</p>";

        try {
          const response = await fetch(
            "https://hoca-backend-d1fg.onrender.com/api/pricing",
          );
          const plans = await response.json();

          let html = "<h2>✅ Kết quả từ API:</h2>";
          plans.forEach((plan) => {
            html += `
                        <div class="plan">
                            <h3>${plan.name}</h3>
                            <div class="price">${plan.price.toLocaleString("vi-VN")}đ</div>
                            <p>Tier: ${plan.tier}</p>
                            <p>Duration: ${plan.durationDays} days</p>
                        </div>
                    `;
          });

          html +=
            "<h3>📋 Raw JSON:</h3><pre>" +
            JSON.stringify(plans, null, 2) +
            "</pre>";
          resultDiv.innerHTML = html;
        } catch (error) {
          resultDiv.innerHTML = `<p style="color: red;">❌ Lỗi: ${error.message}</p>`;
        }
      }

      // Auto-run on load
      window.onload = testAPI;
    </script>
  </body>
</html>
